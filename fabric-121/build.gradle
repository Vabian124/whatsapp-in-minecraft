plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.18-SNAPSHOT'
}

version = '1.0.0+1.21.11'
group = 'dev.whatsappmc'

base {
	archivesName = 'whatsappchat'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		whatsappchat {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft 'com.mojang:minecraft:1.21.11'
	mappings loom.officialMojangMappings()
	modImplementation 'net.fabricmc:fabric-loader:0.19.5'
	modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
	modCompileOnly 'com.terraformersmc:modmenu:17.0.1'
}

sourceSets {
	main {
		java {
			srcDir layout.projectDirectory.dir('../shared/src/main/java')
			srcDir layout.projectDirectory.dir('../server-common/java')
		}
	}
	client {
		java {
			srcDir layout.projectDirectory.dir('../client-common/java')
		}
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}
